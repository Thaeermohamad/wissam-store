<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز وسام للإلكترونيات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #1e3c5c; margin-bottom: 15px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #2d7fc1; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.green { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f0f5fe; padding: 8px; text-align: right; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e3c5c; color: white; padding: 12px 24px; border-radius: 30px; display: none; z-index: 999; }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 اختبار المجموعات</h1>
    
    <div class="card">
        <h3>➕ إضافة قطعة</h3>
        <div class="form-row">
            <select id="itemCategory" style="width:150px">
                <option value="">اختر المجموعة</option>
            </select>
            <input type="text" id="itemName" placeholder="اسم القطعة" style="flex:2">
            <input type="number" id="itemQty" placeholder="الكمية" style="width:80px" min="1">
            <button class="green" onclick="addItem()">➕ إضافة</button>
        </div>
    </div>
    
    <div class="card">
        <h3>📋 المخزن</h3>
        <table>
            <thead><tr><th>المجموعة</th><th>القطعة</th><th>الكمية</th></tr></thead>
            <tbody id="storeTable"><tr><td colspan="3">لا توجد قطع</td></tr></tbody>
        </table>
    </div>
</div>
<div id="msg" class="msg"></div>

<script>
let db;
const request = indexedDB.open('TestCategories', 1);

request.onupgradeneeded = function(e) {
    const d = e.target.result;
    if (!d.objectStoreNames.contains('categories')) {
        d.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
    }
    if (!d.objectStoreNames.contains('items')) {
        d.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
    }
};

request.onsuccess = function(e) {
    db = e.target.result;
    loadCategories();
    loadItems();
};

function showMsg(t) {
    const m = document.getElementById('msg');
    m.textContent = t; m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 2000);
}

function loadCategories() {
    db.transaction('categories', 'readonly').objectStore('categories').getAll().onsuccess = function(e) {
        const cats = e.target.result;
        const select = document.getElementById('itemCategory');
        select.innerHTML = '<option value="">➕ مجموعة جديدة...</option>' +
            '<option value="">---</option>' +
            cats.map(c => '<option value="' + c.name + '">' + c.name + '</option>').join('');
    };
}

document.getElementById('itemCategory').addEventListener('change', function() {
    if (this.value === '➕ مجموعة جديدة...') {
        const name = prompt('اسم المجموعة:');
        if (name && name.trim()) {
            const tx = db.transaction('categories', 'readwrite');
            tx.objectStore('categories').add({ name: name.trim() });
            tx.oncomplete = function() {
                loadCategories();
                document.getElementById('itemCategory').value = name.trim();
                showMsg('✅ تمت إضافة المجموعة: ' + name);
            };
        } else {
            this.value = '';
        }
    }
});

function addItem() {
    const cat = document.getElementById('itemCategory').value;
    const name = document.getElementById('itemName').value.trim();
    const qty = parseInt(document.getElementById('itemQty').value) || 1;
    
    if (!name) { showMsg('⚠️ اكتب اسم القطعة'); return; }
    if (cat === '➕ مجموعة جديدة...' || cat === '---' || cat === '') {
        showMsg('⚠️ اختر مجموعة صحيحة');
        return;
    }
    
    db.transaction('items', 'readwrite').objectStore('items').add({
        category: cat, name: name, quantity: qty
    }).transaction.oncomplete = function() {
        showMsg('✅ تم: ' + name);
        document.getElementById('itemName').value = '';
        document.getElementById('itemQty').value = '1';
        loadItems();
    };
}

function loadItems() {
    db.transaction('items', 'readonly').objectStore('items').getAll().onsuccess = function(e) {
        const items = e.target.result;
        const tbody = document.getElementById('storeTable');
        if (items.length) {
            tbody.innerHTML = items.map(i => 
                '<tr><td>' + i.category + '</td><td>' + i.name + '</td><td>' + i.quantity + '</td></tr>'
            ).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="3">لا توجد قطع</td></tr>';
        }
    };
}
</script>
</body>
</html>
